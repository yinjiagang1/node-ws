<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的静态网页</title>
    <style>
        body {
            margin: 0;
            font-family: "微软雅黑", sans-serif;
            background: #f7f7f7;
        }

        header {
            background: #4A90E2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    <h1>欢迎来到我的静态网页</h1>
</header>

<div class="container">
    <h2>这是一个示例页面</h2>
    <p>你可以在这里放置任何内容，例如文本、图片或按钮。</p>

    <p>下面是一个按钮示例：</p>
    <button onclick="alert('你点击了按钮！')">点我</button>

    <p style="margin-top:20px;">你也可以将这个页面扩展成完整的网站。</p>
</div>

<footer>
    © 2025 我的静态网页
</footer>

</body>
</html>
